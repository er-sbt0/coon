[workspace]
resolver = "2"
members = [
    "crates/coon",
    "crates/model",
    "crates/lsp",
    "crates/logic",
    "crates/core",
    "crates/tui",
    "crates/grid",
    "crates/web",
    "crates/desktop"
]

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
fern = "0.6"
chrono = { version = "0.4", features = ["serde"] }
lsp-types = "0.95"
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
ratatui = "0.29"
petgraph = "0.6"
crossterm = "0.28"
pretty_env_logger = "0.5"
tempfile = "3.0"

# Internal crates
model = { path = "crates/model" }
logic = { path = "crates/logic" }
core = { path = "crates/core" }
lsp = { path = "crates/lsp" }
tui = { path = "crates/tui" }
grid = { path = "crates/grid" }
web = { path = "crates/web" }
desktop = { path = "crates/desktop" }
axum = { version = "0.7", features = ["ws"] }

[profile.dev]
# Keep file/line info for backtraces in our own crates, but skip full debug
# info: `target/debug` was dominated by dependency symbols.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies get no debug info at all — we don't step into them.
debug = false
