[package]
name = "core"
version = "0.1.0"
edition = "2021"

[dependencies]
model.workspace = true
lsp.workspace = true
compdb.workspace = true
clang-index.workspace = true
anyhow.workspace = true
logic.workspace = true
log.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
lsp-types.workspace = true
uuid.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
grid.workspace = true
fern.workspace = true
chrono.workspace = true

[dev-dependencies]
# The `load` example drives the loader, so it needs a runtime to drive it with;
# the library itself only ever borrows the caller's.
tokio = { workspace = true }

# The comparison logic is pure and has unit tests; this runs them with the
# crate's own, without needing clangd.
[[example]]
name = "parity"
test = true
