<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COON — Call Graph</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="app.css" />
  <!-- Vendored, not CDN: the desktop frontend embeds these and must work offline. -->
  <script src="vendor/cytoscape.min.js"></script>
</head>
<body>
  <!-- Titlebar. On the desktop the window is undecorated, so this row is the
       drag region and carries the window controls; in a browser it is just a
       tab strip and the controls stay hidden. -->
  <header id="titlebar" data-tauri-drag-region>
    <div id="brand" data-tauri-drag-region><span class="dot"></span>COON</div>

    <nav id="tabs" role="tablist" aria-label="Graph workspaces"></nav>
    <button id="tab-new" title="New graph (Ctrl+T)" aria-label="New graph">+</button>

    <div id="titlebar-spacer" data-tauri-drag-region style="flex:1;min-width:var(--sp-4)"></div>

    <div id="window-controls">
      <button class="wc" id="wc-min" aria-label="Minimize" title="Minimize">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          <path d="M0 5h10" stroke="currentColor" stroke-width="1" fill="none"/>
        </svg>
      </button>
      <button class="wc" id="wc-max" aria-label="Maximize" title="Maximize">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          <rect x="0.5" y="0.5" width="9" height="9" stroke="currentColor" stroke-width="1" fill="none"/>
        </svg>
      </button>
      <button class="wc close" id="wc-close" aria-label="Close" title="Close">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          <path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1" fill="none"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Breadcrumb: where you are in the call path, plus view controls. -->
  <div id="breadcrumb-bar">
    <button class="pill" id="sidebar-toggle" title="Toggle sidebar (Ctrl+B)" aria-label="Toggle sidebar">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
        <rect x="0.5" y="1.5" width="11" height="9" stroke="currentColor" fill="none"/>
        <path d="M4.5 1.5v9" stroke="currentColor"/>
      </svg>
    </button>
    <div id="breadcrumb"><span class="placeholder">No graph selected</span></div>
    <div class="pill stepper" id="depth-control" title="How many levels of calls to show">
      <button id="depth-dec" aria-label="Show fewer levels">−</button>
      <span class="stepper-label">depth</span>
      <b id="depth-value">3</b>
      <button id="depth-inc" aria-label="Show more levels">+</button>
    </div>
    <button class="pill" id="dir-toggle" title="Toggle call direction">→ Outgoing</button>
    <div class="pill segmented" id="orient-control" role="group" aria-label="Graph orientation">
      <button id="orient-lr" aria-pressed="true" title="Lay the graph out left to right" aria-label="Left to right">→</button>
      <button id="orient-td" aria-pressed="false" title="Lay the graph out top to bottom" aria-label="Top to bottom">↓</button>
    </div>
    <button class="pill" id="refresh-btn" title="Refresh workspace symbols">Refresh</button>
  </div>

  <div id="main">
    <aside id="sidebar">
      <div id="sidebar-header">Symbols <span id="fn-count"></span></div>
      <input id="search" type="text" placeholder="Filter symbols…" autocomplete="off" spellcheck="false" />
      <ul id="fn-list"><li class="empty">No symbols loaded yet</li></ul>
    </aside>
    <div id="dock-handle" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"></div>
    <div id="cy"></div>
    <div id="expand-btn" title="Expand node">+</div>
  </div>

  <footer id="status-bar">
    <div class="status-item"><span id="lsp-dot"></span><span id="status">Connecting…</span></div>
    <div class="status-item"><b id="stat-symbols">0</b> symbols</div>
    <div class="status-item"><b id="stat-nodes">0</b> in view</div>
    <div class="status-item right" id="info"></div>
  </footer>

  <!-- Command palette / symbol finder. One overlay, two callers. -->
  <div id="palette" hidden>
    <div id="palette-backdrop"></div>
    <div id="palette-box" role="dialog" aria-modal="true" aria-label="Command palette">
      <input id="palette-input" type="text" autocomplete="off" spellcheck="false"
             aria-controls="palette-list" aria-autocomplete="list" />
      <ul id="palette-list" role="listbox"></ul>
      <div id="palette-empty" hidden>No matches</div>
      <div id="palette-footer" hidden></div>
    </div>
  </div>

  <script src="transport.js"></script>
  <script src="palette.js"></script>
  <script src="app.js"></script>
</body>
</html>
